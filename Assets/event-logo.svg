<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 600 600" role="img" aria-label="25 Days of the Word – Jesus Youth Christmas 2026">
  <defs>
    <!-- Deep Christmas green background -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1a5236"/>
      <stop offset="100%" stop-color="#061a10"/>
    </radialGradient>

    <!-- JY amber -->
    <linearGradient id="jyAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb733"/>
      <stop offset="100%" stop-color="#e08c00"/>
    </linearGradient>

    <!-- Gold for "25" and accents -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe5a0"/>
      <stop offset="50%" stop-color="#f0c844"/>
      <stop offset="100%" stop-color="#b8832a"/>
    </linearGradient>

    <!-- Cream for text -->
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#e8d49a"/>
    </linearGradient>

    <!-- Star glow halo -->
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f0c844" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0c844" stop-opacity="0"/>
    </radialGradient>

    <!-- Bible page -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf6dc"/>
      <stop offset="100%" stop-color="#e8d49a"/>
    </linearGradient>

    <!-- Soft glow filter for star -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="600" height="600" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle radial texture rings -->
  <circle cx="300" cy="300" r="270" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="80"/>
  <circle cx="300" cy="300" r="262" fill="none" stroke="#e8c56a" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="252" fill="none" stroke="#e8c56a" stroke-opacity="0.06" stroke-width="0.8"/>

  <!-- ══ 25 ADVENT DOTS around the outer ring ══ -->
  <!-- Evenly spaced, r=257, starting from top, 25 dots at 360/25 = 14.4° each -->
  <g opacity="0.55" fill="#e8c56a">
    <circle cx="300.0" cy="43.0" r="4"/>     <!-- 1  top -->
    <circle cx="339.5" cy="45.9" r="3.2"/>   <!-- 2 -->
    <circle cx="376.9" cy="54.4" r="3.2"/>   <!-- 3 -->
    <circle cx="411.0" cy="68.9" r="3.2"/>   <!-- 4 -->
    <circle cx="440.7" cy="88.8" r="3.2"/>   <!-- 5 -->
    <circle cx="465.3" cy="113.6" r="3.2"/>  <!-- 6 -->
    <circle cx="484.0" cy="142.5" r="3.2"/>  <!-- 7 -->
    <circle cx="496.4" cy="174.5" r="3.2"/>  <!-- 8 -->
    <circle cx="502.0" cy="208.3" r="3.2"/>  <!-- 9 -->
    <circle cx="501.0" cy="242.8" r="3.2"/>  <!-- 10 -->
    <circle cx="493.5" cy="276.5" r="3.2"/>  <!-- 11 -->
    <circle cx="479.7" cy="308.3" r="3.2"/>  <!-- 12 -->
    <circle cx="460.1" cy="337.0" r="3.2"/>  <!-- 13 -->
    <circle cx="435.3" cy="361.7" r="3.2"/>  <!-- 14 -->
    <circle cx="406.2" cy="381.4" r="3.2"/>  <!-- 15 -->
    <circle cx="373.7" cy="395.6" r="3.2"/>  <!-- 16 -->
    <circle cx="339.3" cy="403.9" r="3.2"/>  <!-- 17 -->
    <circle cx="303.8" cy="405.9" r="3.2"/>  <!-- 18 -->
    <circle cx="268.6" cy="401.5" r="3.2"/>  <!-- 19 -->
    <circle cx="234.4" cy="390.9" r="3.2"/>  <!-- 20 -->
    <circle cx="202.7" cy="374.2" r="3.2"/>  <!-- 21 -->
    <circle cx="174.5" cy="352.1" r="3.2"/>  <!-- 22 -->
    <circle cx="150.8" cy="325.4" r="3.2"/>  <!-- 23 -->
    <circle cx="132.5" cy="295.1" r="3.2"/>  <!-- 24 -->
    <!-- Day 25 — Christmas! Larger gold star-dot -->
    <circle cx="120.2" cy="262.2" r="5.5" fill="#ffe066"/>
  </g>

  <!-- ══ STAR OF BETHLEHEM ══ -->
  <!-- Halo -->
  <circle cx="300" cy="118" r="58" fill="url(#starHalo)"/>
  <!-- 8-pointed star -->
  <g filter="url(#glow)">
    <path d="M300,62 L309,100 L344,80 L324,113 L362,118 L324,124 L344,157 L309,137 L300,175 L291,137 L256,157 L276,124 L238,118 L276,113 L256,80 L291,100 Z"
          fill="url(#goldGrad)"/>
  </g>
  <!-- Star centre bright -->
  <circle cx="300" cy="118" r="13" fill="#fffde0" opacity="0.95"/>
  <!-- Long vertical and horizontal rays -->
  <line x1="300" y1="44" x2="300" y2="66" stroke="#ffe5a0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="300" y1="170" x2="300" y2="192" stroke="#ffe5a0" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="228" y1="118" x2="250" y2="118" stroke="#ffe5a0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="350" y1="118" x2="372" y2="118" stroke="#ffe5a0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- ══ OPEN BIBLE ══ -->
  <!-- Shadow -->
  <ellipse cx="300" cy="348" rx="148" ry="10" fill="#000" opacity="0.3"/>
  <!-- Left cover -->
  <path d="M136,218 Q142,212 155,210 L298,218 L298,345 L155,352 Q142,350 136,344 Z"
        fill="#1e6b40" stroke="#144d2c" stroke-width="1.2"/>
  <!-- Left page -->
  <path d="M155,210 Q222,205 298,218 L298,345 Q222,353 155,352 Z"
        fill="url(#pageGrad)"/>
  <!-- Spine -->
  <rect x="290" y="214" width="20" height="130" rx="5" fill="#5a2f10"/>
  <!-- Right page -->
  <path d="M310,218 Q378,205 445,210 L445,352 Q378,353 310,345 Z"
        fill="url(#pageGrad)"/>
  <!-- Right cover -->
  <path d="M464,218 Q458,212 445,210 L310,218 L310,345 L445,352 Q458,350 464,344 Z"
        fill="#1e6b40" stroke="#144d2c" stroke-width="1.2"/>

  <!-- Left page lines -->
  <g fill="#8b6914" opacity="0.4">
    <rect x="168" y="236" width="110" height="3" rx="1.5"/>
    <rect x="168" y="246" width="98" height="3" rx="1.5"/>
    <rect x="168" y="256" width="105" height="3" rx="1.5"/>
    <rect x="168" y="266" width="90" height="3" rx="1.5"/>
    <rect x="168" y="276" width="108" height="3" rx="1.5"/>
    <rect x="168" y="286" width="95" height="3" rx="1.5"/>
    <rect x="168" y="300" width="110" height="3" rx="1.5"/>
    <rect x="168" y="310" width="100" height="3" rx="1.5"/>
    <rect x="168" y="320" width="106" height="3" rx="1.5"/>
    <rect x="168" y="330" width="88" height="3" rx="1.5"/>
  </g>
  <!-- Right page lines -->
  <g fill="#8b6914" opacity="0.4">
    <rect x="322" y="236" width="110" height="3" rx="1.5"/>
    <rect x="322" y="246" width="100" height="3" rx="1.5"/>
    <rect x="322" y="256" width="96" height="3" rx="1.5"/>
    <rect x="322" y="266" width="110" height="3" rx="1.5"/>
    <rect x="322" y="276" width="104" height="3" rx="1.5"/>
    <rect x="322" y="286" width="98" height="3" rx="1.5"/>
    <rect x="322" y="300" width="110" height="3" rx="1.5"/>
    <rect x="322" y="310" width="94" height="3" rx="1.5"/>
    <rect x="322" y="320" width="107" height="3" rx="1.5"/>
    <rect x="322" y="330" width="90" height="3" rx="1.5"/>
  </g>

  <!-- ══ JY LOGO BADGE (small, bottom-left of bible) ══ -->
  <!-- Orange circle badge -->
  <circle cx="174" cy="310" r="30" fill="url(#jyAmber)" filter="url(#shadow)" opacity="0.92"/>
  <circle cx="174" cy="310" r="27" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.5"/>
  <!-- JY icon simplified (cross + Y shape in white) -->
  <!-- Cross top (head oval) -->
  <ellipse cx="174" cy="291" rx="4" ry="5.5" fill="#fff"/>
  <!-- Cross arms -->
  <path d="M165,298 Q170,296 174,296 Q178,296 183,298 Q179,302 174,302 Q169,302 165,298 Z" fill="#fff"/>
  <!-- Vertical bar of cross -->
  <rect x="172" y="296" width="4" height="10" rx="1.5" fill="#fff"/>
  <!-- Y shape (the tuning fork) -->
  <path d="M169,308 Q169,316 174,320 Q179,316 179,308" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="166" y1="306" x2="172" y2="310" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="182" y1="306" x2="176" y2="310" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="174" y1="310" x2="174" y2="322" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>

  <!-- ══ HERO NUMBER "25" ══ -->
  <text x="300" y="418" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="96" font-weight="700"
        fill="url(#goldGrad)" filter="url(#textGlow)" opacity="0.97">25</text>

  <!-- ══ TITLE: DAYS OF THE WORD ══ -->
  <text x="300" y="455" text-anchor="middle"
        font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="5"
        fill="url(#creamGrad)" opacity="0.95">DAYS OF THE WORD</text>

  <!-- Decorative rule lines flanking title -->
  <line x1="84"  y1="468" x2="210" y2="468" stroke="#e8c56a" stroke-width="0.9" stroke-opacity="0.5"/>
  <circle cx="300" cy="468" r="3.5" fill="#e8c56a" opacity="0.65"/>
  <line x1="390" y1="468" x2="516" y2="468" stroke="#e8c56a" stroke-width="0.9" stroke-opacity="0.5"/>

  <!-- ══ SUBTITLE: organisation ══ -->
  <text x="300" y="492" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13.5" letter-spacing="2"
        fill="#8ecfa8" opacity="0.88">JESUS YOUTH · PAZHASSI RAJA COLLEGE</text>

  <!-- ══ YEAR ══ -->
  <text x="300" y="514" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" letter-spacing="3"
        fill="#5a9a72" opacity="0.75">CHRISTMAS 2026</text>

  <!-- Inner border vignette -->
  <rect width="600" height="600" rx="110" fill="none" stroke="#000" stroke-width="22" stroke-opacity="0.25"/>
</svg>
