<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; background: #F7F5F0; }
    .title {
      font-size: 2rem;
      font-weight: 800;
      color: #1A1714;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wave-accent {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25em;
      height: 1.25em;
      transform-origin: 75% 75%;
      animation: wave-hand 2.2s ease-in-out infinite;
    }
    .wave-accent svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    @keyframes wave-hand {
      0%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20%, 40% { transform: rotate(-8deg); }
      50% { transform: rotate(10deg); }
      60% { transform: rotate(0deg); }
    }
  </style>
</head>
