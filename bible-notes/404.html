<!doctype html>
<html lang="en" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <title>Page not found · Advent 26</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = localStorage.getItem('xmas2026.theme.v1');
      if (t === 'candle' || t === 'day') document.documentElement.dataset.theme = t;
    } catch (e) { /* storage unavailable */ }
  </script>
  <style>
    .notfound-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .notfound-card {
      width: min(380px, 100%);
      background: var(--panel, #FFFFFF);
      border: 1px solid rgba(22, 42, 30, 0.07);
      border-radius: 24px;
      padding: 32px 24px 28px;
      box-shadow: 0 14px 34px -14px rgba(18, 30, 22, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .notfound-card img { width: 64px; height: 64px; border-radius: 50%; }
    .notfound-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--xmas-red, #B91C1C);
      margin: 4px 0 0;
    }
    .notfound-card h1 { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .notfound-card p  { font-size: 0.92rem; color: var(--ink-soft, #4D5A52); margin: 0; max-width: 28ch; }
    .notfound-card a  {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 10px;
      padding: 13px 20px;
      background: #183D25;
      color: #fff;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 10px 22px -8px rgba(24, 61, 37, 0.42);
    }
  </style>
</head>
<body>
  <div class="notfound-wrap">
    <div class="notfound-card">
      <img src="icon-512.png" alt="Advent 26">
      <span class="notfound-kicker">Advent 26</span>
      <h1>Page not found</h1>
      <p>That door doesn't exist. Head back to the Advent calendar.</p>
      <a href="/">Open Advent 26 →</a>
    </div>
  </div>
</body>
</html>
