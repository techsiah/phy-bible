<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="25 Days of the Word – Jesus Youth Christmas 2026">
  <defs>
    <!-- Deep forest green background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#164d35"/>
      <stop offset="100%" stop-color="#061a10"/>
    </radialGradient>
    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8c56a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold gradient for text/star -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e5a0"/>
      <stop offset="100%" stop-color="#b8832a"/>
    </linearGradient>
    <!-- Warm gold for subtitle -->
    <linearGradient id="goldSubtitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c56a"/>
      <stop offset="100%" stop-color="#c4932a"/>
    </linearGradient>
    <!-- Bible pages -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf5dc"/>
      <stop offset="100%" stop-color="#e8d49a"/>
    </linearGradient>
    <!-- Halo filter -->
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundRect">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#e8c56a" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#e8c56a" stroke-opacity="0.08" stroke-width="0.8"/>

  <!-- 25 small dot markers around the circle (Advent dots) -->
  <!-- These represent the 25 days -->
  <g opacity="0.5">
    <!-- Dots at every ~14.4° around r=215 -->
    <circle cx="256" cy="41" r="3" fill="#e8c56a"/>        <!-- day 1 (top) -->
    <circle cx="293" cy="43.5" r="2.5" fill="#e8c56a"/>
    <circle cx="328" cy="51.5" r="2.5" fill="#e8c56a"/>
    <circle cx="360" cy="65" r="2.5" fill="#e8c56a"/>
    <circle cx="389" cy="84" r="2.5" fill="#e8c56a"/>
    <circle cx="413" cy="108" r="2.5" fill="#e8c56a"/>
    <circle cx="432" cy="136" r="2.5" fill="#e8c56a"/>
    <circle cx="446" cy="168" r="2.5" fill="#e8c56a"/>
    <circle cx="454" cy="202" r="2.5" fill="#e8c56a"/>
    <circle cx="455" cy="237" r="2.5" fill="#e8c56a"/>
    <circle cx="450" cy="272" r="2.5" fill="#e8c56a"/>
    <circle cx="440" cy="305" r="2.5" fill="#e8c56a"/>
    <circle cx="424" cy="335" r="2.5" fill="#e8c56a"/>
    <circle cx="403" cy="362" r="2.5" fill="#e8c56a"/>
    <!-- day 25 star at top highlighted -->
    <circle cx="378" cy="385" r="2.5" fill="#e8c56a"/>
    <circle cx="348" cy="403" r="2.5" fill="#e8c56a"/>
    <circle cx="316" cy="416" r="2.5" fill="#e8c56a"/>
    <circle cx="282" cy="423" r="2.5" fill="#e8c56a"/>
    <circle cx="247" cy="425" r="2.5" fill="#e8c56a"/>
    <circle cx="213" cy="420" r="2.5" fill="#e8c56a"/>
    <circle cx="181" cy="409" r="2.5" fill="#e8c56a"/>
    <circle cx="151" cy="393" r="2.5" fill="#e8c56a"/>
    <circle cx="124" cy="372" r="2.5" fill="#e8c56a"/>
    <circle cx="102" cy="346" r="2.5" fill="#e8c56a"/>
    <!-- day 25 completion dot, slightly larger -->
    <circle cx="84" cy="317" r="3.5" fill="#f9e5a0"/>
  </g>

  <!-- Star of Bethlehem glow halo -->
  <circle cx="256" cy="118" r="56" fill="url(#starGlow)" opacity="0.7"/>

  <!-- Star of Bethlehem (8-pointed) -->
  <g filter="url(#starFilter)">
    <path d="M256,68 L263,105 L296,86 L277,115 L314,118 L277,122 L296,151 L263,132 L256,169 L249,132 L216,151 L235,122 L198,118 L235,115 L216,86 L249,105 Z"
          fill="url(#goldGrad)" opacity="0.95"/>
  </g>
  <!-- Star center bright -->
  <circle cx="256" cy="118" r="12" fill="#fff8e1" opacity="0.9"/>

  <!-- Star rays (subtle cross-beams) -->
  <line x1="256" y1="58" x2="256" y2="78" stroke="#f9e5a0" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="316" y1="118" x2="296" y2="118" stroke="#f9e5a0" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="196" y1="118" x2="216" y2="118" stroke="#f9e5a0" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Open Bible body -->
  <!-- Bible spine (center) -->
  <rect x="246" y="210" width="20" height="130" rx="4" fill="#6b3c18"/>
  <!-- Left page -->
  <path d="M120 210 Q180 205 246 210 L246 340 Q180 348 120 340 Z" fill="url(#pageGrad)"/>
  <!-- Right page -->
  <path d="M266 210 Q332 205 392 210 L392 340 Q332 348 266 340 Z" fill="url(#pageGrad)"/>
  <!-- Bible cover left -->
  <path d="M114 207 Q118 202 128 200 L246 207 L246 342 L128 349 Q118 347 114 342 Z" fill="#2d5a3d" stroke="#1a3d28" stroke-width="1"/>
  <!-- Bible cover right -->
  <path d="M398 207 Q394 202 384 200 L266 207 L266 342 L384 349 Q394 347 398 342 Z" fill="#2d5a3d" stroke="#1a3d28" stroke-width="1"/>

  <!-- Left page text lines -->
  <g fill="#8b6914" opacity="0.5">
    <rect x="140" y="230" width="88" height="3" rx="1.5"/>
    <rect x="140" y="240" width="80" height="3" rx="1.5"/>
    <rect x="140" y="250" width="85" height="3" rx="1.5"/>
    <rect x="140" y="260" width="75" height="3" rx="1.5"/>
    <rect x="140" y="270" width="88" height="3" rx="1.5"/>
    <rect x="140" y="280" width="82" height="3" rx="1.5"/>
    <rect x="140" y="295" width="88" height="3" rx="1.5"/>
    <rect x="140" y="305" width="80" height="3" rx="1.5"/>
    <rect x="140" y="315" width="85" height="3" rx="1.5"/>
  </g>

  <!-- Right page text lines -->
  <g fill="#8b6914" opacity="0.5">
    <rect x="284" y="230" width="88" height="3" rx="1.5"/>
    <rect x="284" y="240" width="82" height="3" rx="1.5"/>
    <rect x="284" y="250" width="78" height="3" rx="1.5"/>
    <rect x="284" y="260" width="88" height="3" rx="1.5"/>
    <rect x="284" y="270" width="84" height="3" rx="1.5"/>
    <rect x="284" y="280" width="80" height="3" rx="1.5"/>
    <rect x="284" y="295" width="88" height="3" rx="1.5"/>
    <rect x="284" y="305" width="76" height="3" rx="1.5"/>
    <rect x="284" y="315" width="85" height="3" rx="1.5"/>
  </g>

  <!-- Cross watermark on right page -->
  <g opacity="0.1" fill="#c49a45">
    <rect x="318" y="255" width="4" height="20" rx="2"/>
    <rect x="310" y="261" width="20" height="4" rx="2"/>
  </g>

  <!-- Book shadow/base -->
  <ellipse cx="256" cy="344" rx="145" ry="8" fill="#000" opacity="0.25"/>

  <!-- "25" large number - the hero numeral -->
  <text x="256" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="80" font-weight="700" fill="url(#goldGrad)" filter="url(#textGlow)" opacity="0.95">25</text>

  <!-- Main title: DAYS OF THE WORD -->
  <text x="256" y="435" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="4" fill="#e8c56a" opacity="0.95">DAYS OF THE WORD</text>

  <!-- Decorative divider lines -->
  <line x1="90" y1="448" x2="186" y2="448" stroke="#e8c56a" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="326" y1="448" x2="422" y2="448" stroke="#e8c56a" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="256" cy="448" r="3" fill="#e8c56a" opacity="0.6"/>

  <!-- Bottom: Jesus Youth + College -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="13" fill="#a8c8a0" opacity="0.85" letter-spacing="1.5">JESUS YOUTH · PAZHASSI RAJA COLLEGE</text>

  <!-- Year badge top-right corner -->
  <text x="256" y="488" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="11" fill="#6a9b78" opacity="0.7" letter-spacing="2">CHRISTMAS 2026</text>

  <!-- Inner vignette for depth -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#000" stroke-width="20" stroke-opacity="0.3"/>
</svg>